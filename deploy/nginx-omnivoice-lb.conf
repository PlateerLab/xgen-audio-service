# nginx load balancer for the OmniVoice replica pool (gpu-pool.example.yml).
# Round-robins TTS requests across the per-GPU replicas and presents one endpoint.

upstream omnivoice_pool {
    # Add/remove to match the replicas in gpu-pool.example.yml.
    server omnivoice-0:9881 max_fails=3 fail_timeout=30s;
    server omnivoice-1:9881 max_fails=3 fail_timeout=30s;
    server omnivoice-2:9881 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

server {
    listen 9881;
    server_name _;

    # TTS synthesis can take a while (diffusion steps); don't cut it off, and
    # stream the response body straight through for the pcm/ogg streaming path.
    proxy_read_timeout    300s;
    proxy_send_timeout    300s;
    proxy_connect_timeout 10s;
    proxy_buffering       off;
    client_max_body_size  25m;

    location / {
        proxy_pass         http://omnivoice_pool;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
    }

    # Health of the LB itself (each replica also has its own /health).
    location = /_lb_health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
